name: Build Blog

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
        echo "${{ github.workspace }}/vcpkg" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        ./vcpkg/vcpkg install cmark
        # Add other deps if needed
    
    - name: Configure CMake (use clang-linux-release preset)
      run: cmake --preset clang-linux-release -DVCPKG_ROOT_PATH=${{ github.workspace }}/vcpkg
    
    - name: Build
      run: cmake --build --preset clang-linux-release
    
    - name: Generate Site
      run: ./bin/clang/blog-parser
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./html