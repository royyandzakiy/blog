name: Build Blog

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
        echo "${{ github.workspace }}/vcpkg" >> $GITHUB_PATH
    
    - name: Configure CMake (use clang-linux-release preset)
      run: cmake --preset clang-linux-release -DVCPKG_ROOT_PATH=${{ github.workspace }}/vcpkg
    
    - name: Build
      run: cmake --build --preset clang-linux-release
    
    - name: Generate Site
      run: ./bin/clang/blog-parser
    
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./html
    
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4